<header class="header">
  <div class="header-container container">
    <a class="header-logo" href="./index.html" aria-label="Pet Candy home">
      <img src="./img/logo.svg" alt="Pet Candy" width="76" height="30" />
    </a>

    <nav class="header-navigation" aria-label="Main navigation">
      <a class="header-link" data-menu-link href="#about">About</a>
      <a class="header-link" data-menu-link href="#how-to-play">How to Play</a>
      <a class="header-link" data-menu-link href="#features">Features</a>
      <a class="header-link" data-menu-link href="#characters">Characters</a>
      <a class="header-link" data-menu-link href="#faq">FAQ</a>
    </nav>

    <a
      class="google-link-btn header-store-link"
      href="https://play.google.com/store/apps/details?id=com.matchgames.petcandypuzzle&hl=en&gl=us"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Get Pet Candy on Google Play"
    >
      <svg class="google-icon" width="24" height="24" aria-hidden="true">
    <use href="./img/sprite.svg#icon-triangle-google-btn"></use>
  </svg>
  <span>Google Play</span>
</a>

    <button
      class="burger-button"
      type="button"
      data-action="open"
      aria-label="Open menu"
      aria-controls="mobile-menu"
      aria-expanded="false"
    >
      <svg class="burger-menu-icon" width="44" height="44" aria-hidden="true">
        <use href="./img/sprite.svg#icon-burger"></use>
      </svg>
    </button>
  </div>

  <div
    class="mobile-menu"
    id="mobile-menu"
    data-visible="close"
    aria-hidden="true"
  >
    <div class="mobile-backdrop" data-action="close"></div>
    <div
      class="mobile-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Mobile navigation"
    >
      <button
        class="mobile-close"
        type="button"
        data-action="close"
        aria-label="Close menu"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <nav class="mobile-navigation" aria-label="Mobile navigation">
        <a class="mobile-link" data-menu-link href="#about">About</a>
        <a class="mobile-link" data-menu-link href="#how-to-play"
          >How to Play</a
        >
        <a class="mobile-link" data-menu-link href="#features">Features</a>
        <a class="mobile-link" data-menu-link href="#characters">Characters</a>
        <a class="mobile-link" data-menu-link href="#faq">FAQ</a>
      </nav>

      <a
        class="google-link-btn mobile-google-link"
        href="https://play.google.com/store/apps/details?id=com.matchgames.petcandypuzzle&hl=en&gl=us"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Get Pet Candy on Google Play"
      >
        <svg class="google-icon" width="24" height="24" aria-hidden="true">
    <use href="./img/sprite.svg#icon-triangle-google-btn"></use>
  </svg>
  <span>Google Play</span>
</a>
    </div>
  </div>
</header>
