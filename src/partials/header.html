<header class="header">
  <div class="header-container container">
    <a class="header-logo" href="./index.html" aria-label="Pet Candy home">
      <img src="./img/logo.svg" alt="Pet Candy" width="76" height="30" />
    </a>

    <nav class="header-navigation" aria-label="Main navigation">
      <a class="header-link" href="#about">About</a>
      <a class="header-link" href="#how-to-play">How to Play</a>
      <a class="header-link" href="#features">Features</a>
      <a class="header-link" href="#characters">Characters</a>
      <a class="header-link" href="#faq">FAQ</a>
    </nav>

    <button
      class="store-link header-store-link"
      type="button"
      aria-label="Get Pet Candy on Google Play"
    >
      <span class="store-icon" aria-hidden="true"></span>
      <span>Google Play</span>
    </button>

    <button
      class="burger-button"
      type="button"
      data-action="open"
      aria-label="Open menu"
      aria-controls="mobile-menu"
      aria-expanded="false"
    >
      <svg class="burger-menu-icon" width="44" height="44" aria-hidden="true">
        <use href="./img/sprite.svg#icon-burger-icon"></use>
      </svg>
    </button>
  </div>

  <div
    class="mobile-menu"
    id="mobile-menu"
    data-visible="close"
    aria-hidden="true"
  >
    <div class="mobile-backdrop" data-action="close"></div>
    <div
      class="mobile-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Mobile navigation"
    >
      <button
        class="mobile-close"
        type="button"
        data-action="close"
        aria-label="Close menu"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <nav class="mobile-navigation" aria-label="Mobile navigation">
        <a class="mobile-link" href="#about">About</a>
        <a class="mobile-link" href="#how-to-play">How to Play</a>
        <a class="mobile-link" href="#features">Features</a>
        <a class="mobile-link" href="#characters">Characters</a>
        <a class="mobile-link" href="#faq">FAQ</a>
      </nav>

      <button
        class="store-link mobile-store-link"
        type="button"
        aria-label="Get Pet Candy on Google Play"
      >
        <span class="store-icon" aria-hidden="true"></span>
        <span>Google Play</span>
      </button>
    </div>
  </div>
</header>
